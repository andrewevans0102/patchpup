name: PatchPup issue workflow

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize actor and issue author
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - name: Check configured maintainer allowlist
        id: authorize
        env:
          AUTHORIZED_ACTORS: ${{ vars.PATCHPUP_AUTHORIZED_ACTORS }}
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const outputPath = process.env.GITHUB_OUTPUT;
          let authorized = false;
          try {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const allowed = JSON.parse(process.env.AUTHORIZED_ACTORS || 'null');
            if (Array.isArray(allowed) && event.action === 'labeled' &&
                event.label?.name === 'patchpup' && event.issue?.number &&
                typeof event.issue?.user?.login === 'string' &&
                typeof event.sender?.login === 'string') {
              const allowset = new Set(allowed.filter((x) => typeof x === 'string').map((x) => x.toLowerCase()));
              authorized = allowset.has(event.sender.login.toLowerCase()) &&
                allowset.has(event.issue.user.login.toLowerCase());
            }
          } catch {
            authorized = false;
          }
          fs.appendFileSync(outputPath, `authorized=${authorized}\n`);
          console.log(authorized ? 'PatchPup authorization accepted.' : 'PatchPup authorization rejected; no write-capable job will run.');
          NODE

  build-pr:
    name: Implement, verify, and open PR
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: patchpup-${{ github.repository }}-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run PatchPup
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PATCHPUP_AUTHORIZED_ACTORS: ${{ vars.PATCHPUP_AUTHORIZED_ACTORS }}
          PATCHPUP_MODEL: openrouter/recursive/flint-v1.0:free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run patchpup:run

      - name: Upload structured run events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patchpup-events-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            patchpup-events.jsonl
            patchpup-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
